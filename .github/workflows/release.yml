name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches manifest version
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/llm_agent/manifest.json'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd custom_components/llm_agent && zip -qr ../../llm_agent.zip . -x '__pycache__/*' && cd ../..
          gh release create "$GITHUB_REF_NAME" llm_agent.zip --generate-notes --title "$GITHUB_REF_NAME"
